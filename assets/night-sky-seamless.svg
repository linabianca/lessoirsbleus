    <linearGradient id="nightSkyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1428;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f2238;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2d4d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle glow filter for stars -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="0.3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
